<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AR-планшеты · PUMP-001</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { display: flex; align-items: center; justify-content: center; height: 100%; }
  #board { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  #hint {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center; color: #fff; text-align: center;
    background: rgba(0,0,0,.88); cursor: pointer; padding: 24px;
    font-size: 22px; font-weight: 600;
  }
  #hint small { font-weight: 400; opacity: .75; font-size: 15px; line-height: 1.5; }
  #badge {
    position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border-radius: 8px;
    background: rgba(0,0,0,.65); color: #fff; font-size: 14px; opacity: .55;
    transition: opacity .3s;
  }
  #badge.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="stage"><img id="board" src="../out_real/board_A3.png" alt="AR-планшет"></div>
  <div id="hint">
    <div>Нажмите для полноэкранного режима</div>
    <small>
      Клавиша 1 — чистый планшет · 2 — дефектный<br>
      Наведите телефон на экран целиком · 50–80 см · без бликов от ламп
    </small>
  </div>
  <div id="badge">чистый</div>
<script>
  const img = document.getElementById('board');
  const hint = document.getElementById('hint');
  const badge = document.getElementById('badge');
  const boards = {
    '1': { src: '../out_real/board_A3.png', label: 'чистый' },
    '2': { src: '../out_defect/board_A3.png', label: 'дефектный' }
  };
  function show(key) {
    const b = boards[key];
    if (!b) return;
    img.src = b.src;
    badge.textContent = b.label;
    badge.classList.add('show');
    clearTimeout(show._t);
    show._t = setTimeout(() => badge.classList.remove('show'), 2000);
  }
  async function go() {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    hint.classList.add('hidden');
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  hint.addEventListener('click', go);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hint.classList.remove('hidden');
    show(e.key);
  });
</script>
</body>
</html>
