name: ntec_inspector
description: "NTec Инспектор — мобильный помощник инженера: QR, карточка, AR-осмотр, история."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  cupertino_icons: ^1.0.8
  camera: ^0.12.2
  mobile_scanner: ^7.5.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.6
  image: ^4.12.0
  fl_chart: ^1.3.1
  intl: ^0.20.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  shared_preferences_android: 2.4.28


flutter:

  uses-material-design: true




